<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Site Blocked - PhishGuard C++</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 10px;
            border-top: 6px solid #e74c3c;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #e74c3c;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #cccccc;
            line-height: 1.6;
            font-size: 14px;
        }

        .url-box {
            background: #111;
            padding: 12px;
            border-radius: 6px;
            word-break: break-all;
            color: #ff7675;
            margin: 18px 0;
            font-family: monospace;
            border: 1px solid #333;
        }

        button {
            background-color: #00599C;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004478;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚠️ Dangerous Website Blocked</h1>
        <p>PhishGuard's C++ Security Engine has detected that this website may be a phishing or malicious threat.</p>
        <div class="url-box" id="blocked-url"></div>
        <button id="backBtn">Go Back to Safety</button>
    </div>

    <script src="blocked.js"></script>
</body>

</html>
