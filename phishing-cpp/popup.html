<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PhishGuard C++</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="header">
        <h2>🛡️ PhishGuard</h2>
        <label class="switch">
            <input type="checkbox" id="toggleProtection" checked>
            <span class="slider"></span>
        </label>
    </div>

    <div class="stats-card">
        <p>Threats Blocked</p>
        <h1 id="blockedCount">0</h1>
    </div>

    <div class="add-section">
        <input type="text" id="domainInput" placeholder="e.g. badsite.com">
        <button id="addBtn">Block</button>
    </div>

    <div class="list-container">
        <h4>Custom Blocked Domains</h4>
        <ul id="domainList"></ul>
    </div>

    <script src="popup.js"></script>
</body>

</html>
